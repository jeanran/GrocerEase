<div class="sidebar" id="sidebar">
    <div class="sidebar-logo">
        <i class="fas fa-store"></i>
        <h2>Grocer<span>Ease</span></h2>
    </div>

    <ul class="sidebar-menu">

        <!-- Admin only -->
        <li class="menu-item admin-only" id="menuDashboard">
            <a href="{% url 'dashboard' %}">
                <i class="fas fa-tachometer-alt"></i> Dashboard
            </a>
        </li>

        <!-- Both admin and staff -->
        <li class="menu-item" id="menuProducts">
            <a href="{% url 'products' %}">
                <i class="fas fa-boxes"></i> Stocks
            </a>
        </li>

        <li class="menu-item" id="menuStockIn">
            <a href="{% url 'stock_in' %}">
                <i class="fas fa-arrow-circle-down"></i> Stock In
            </a>
        </li>

        <!-- Admin only -->
        {% if request.session.role == 'admin' %}
        <li class="menu-item" id="menuStockInHistory">
            <a href="{% url 'stock_in_history' %}">
                <i class="fas fa-history"></i> Stock In History
            </a>
        </li>
        {% endif %}

        <li class="menu-item" id="menuStockOut">
            <a href="{% url 'stock_out' %}">
                <i class="fas fa-arrow-circle-up"></i> Stock Out
            </a>
        </li>

        <li class="menu-item" id="menuPOS">
            <a href="{% url 'pos' %}">
                <i class="fas fa-shopping-cart"></i> Point of Sale
            </a>
        </li>

        <!-- Admin only -->
        {% if request.session.role == 'admin' %}
        <li class="menu-item" id="menuOrders">
            <a href="{% url 'orders' %}">
                <i class="fas fa-receipt"></i> Transaction History
            </a>
        </li>
        {% endif %}

        <!-- Admin only -->
        <li class="menu-item admin-only" id="menuReports">
            <a href="{% url 'reports' %}">
                <i class="fas fa-chart-line"></i> Reports
            </a>
        </li>

        <li class="menu-item admin-only" id="menuUsers">
            <a href="{% url 'users' %}">
                <i class="fas fa-users"></i> Manage Users
            </a>
        </li>

    </ul>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    let role = '{{ request.session.role }}';

    
    if (role === 'staff') {
        document.querySelectorAll('.admin-only').forEach(function (el) {
            el.style.display = 'none';
        });
    }
});
</script>
