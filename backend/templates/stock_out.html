{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/stock_out.css' %}">
{% endblock %}

{% block content %}

<div class="stockout-container">

    <div class="page-header">
        <h1><i class="fas fa-arrow-circle-up"></i> Stock Out</h1>
        <button class="btn-add" onclick="openAddModal()">
            <i class="fas fa-plus"></i> Record Stock Out
        </button>
    </div>

    <!-- Summary -->
    <div class="stockout-summary">
        <div class="summary-card">
            <div class="summary-icon sold"><i class="fas fa-shopping-bag"></i></div>
            <div class="summary-info">
                <h4>Total Sold</h4>
                <span id="totalSold">0</span>
            </div>
        </div>
        <div class="summary-card">
            <div class="summary-icon damaged"><i class="fas fa-box-open"></i></div>
            <div class="summary-info">
                <h4>Total Damaged</h4>
                <span id="totalDamaged">0</span>
            </div>
        </div>
        <div class="summary-card">
            <div class="summary-icon expired"><i class="fas fa-calendar-times"></i></div>
            <div class="summary-info">
                <h4>Total Expired</h4>
                <span id="totalExpired">0</span>
            </div>
        </div>
        <div class="summary-card">
            <div class="summary-icon total"><i class="fas fa-chart-line"></i></div>
            <div class="summary-info">
                <h4>Total Records</h4>
                <span id="totalRecords">0</span>
            </div>
        </div>
    </div>

    <!-- Filters -->
    <div class="filters">
        <input type="date" id="filterDate">
        <select id="filterReason">
            <option value="">All Reasons</option>
            <option value="sold">Sold</option>
            <option value="damaged">Damaged</option>
            <option value="expired">Expired</option>
            <option value="returned">Returned to Supplier</option>
        </select>
        <input type="text" id="filterSearch" placeholder="Search product...">
    </div>

    <!-- Table -->
    <table class="stockout-table">
        <thead>
            <tr>
                <th>#</th>
                <th>Date</th>
                <th>Product</th>
                <th>Quantity</th>
                <th>Unit</th>
                <th>Reason</th>
                <th>Recorded By</th>
                <th>Notes</th>
            </tr>
        </thead>
        <tbody id="stockOutTableBody"></tbody>
    </table>

</div>

<!-- Record Stock Out Modal -->
<div id="stockOutModal" class="modal">
    <div class="modal-content">
        <h3>Record Stock Out</h3>

        <label class="modal-label">Product</label>
        <select id="stockOutProduct"></select>

        <div class="stock-info" id="stockInfo"></div>

        <label class="modal-label">Quantity</label>
        <input type="number" id="stockOutQty" placeholder="Enter quantity" min="1">

        <label class="modal-label">Unit</label>
        <select id="stockOutUnit">
            <option value="pieces">Pieces</option>
            <option value="packs">Packs</option>
            <option value="boxes">Boxes</option>
            <option value="sacks">Sacks</option>
            <option value="bottles">Bottles</option>
            <option value="cans">Cans</option>
            <option value="kg">Kilograms (kg)</option>
            <option value="liters">Liters</option>
            <option value="dozen">Dozen</option>
            <option value="trays">Trays</option>
        </select>

        <label class="modal-label">Reason</label>
        <select id="stockOutReason">
            <option value="sold">Sold</option>
            <option value="damaged">Damaged</option>
            <option value="expired">Expired</option>
            <option value="returned">Returned to Supplier</option>
        </select>

        <label class="modal-label">Date</label>
        <input type="date" id="stockOutDate">

        <label class="modal-label">Notes (optional)</label>
        <textarea id="stockOutNotes" placeholder="Additional notes..."></textarea>

        <div class="modal-actions">
            <button class="btn-save" onclick="saveStockOut()">Record</button>
            <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        </div>
    </div>
</div>

<script>
    let stockOutRecords = [];
    let allProducts     = [];

    document.getElementById('stockOutDate').valueAsDate = new Date();

    async function loadProducts() {
        try {
            const res  = await fetch('/api/products/');
            const data = await res.json();
            allProducts = data.products || [];

            let select = document.getElementById('stockOutProduct');
            select.innerHTML = allProducts.map(p =>
                `<option value="${p.product_id}" data-stock="${p.stock}" data-unit="${p.unit || 'pieces'}">${p.name} (Stock: ${p.stock})</option>`
            ).join('');

            select.addEventListener('change', updateStockInfo);
            updateStockInfo();
        } catch (err) {
            console.error('Failed to load products:', err);
        }
    }

    function updateStockInfo() {
        let select   = document.getElementById('stockOutProduct');
        let selected = select.options[select.selectedIndex];
        let stock    = selected ? selected.getAttribute('data-stock') : 0;
        let unit     = selected ? selected.getAttribute('data-unit') : 'pieces';

        document.getElementById('stockInfo').innerHTML =
            `<span>Current Stock: <strong>${stock} ${unit}</strong></span>`;

        if (unit) document.getElementById('stockOutUnit').value = unit;
    }

    async function loadStockOut() {
        try {
            const res  = await fetch('/api/stock-out/');
            const data = await res.json();
            stockOutRecords = data.records || [];
            updateSummary(stockOutRecords);
            renderTable(stockOutRecords);
        } catch (err) {
            console.error('Failed to load stock out:', err);
        }
    }

    function updateSummary(records) {
        document.getElementById('totalRecords').innerText = records.length;
        document.getElementById('totalSold').innerText    = records.filter(r => r.reason === 'sold').reduce((s, r) => s + r.quantity, 0);
        document.getElementById('totalDamaged').innerText = records.filter(r => r.reason === 'damaged').reduce((s, r) => s + r.quantity, 0);
        document.getElementById('totalExpired').innerText = records.filter(r => r.reason === 'expired').reduce((s, r) => s + r.quantity, 0);
    }

    function renderTable(records) {
        let search = document.getElementById('filterSearch').value.toLowerCase();
        let date   = document.getElementById('filterDate').value;
        let reason = document.getElementById('filterReason').value;

        let filtered = records.filter(r => {
            let matchSearch = !search || r.product_name.toLowerCase().includes(search);
            let matchDate   = !date   || (r.date && r.date.startsWith(date));
            let matchReason = !reason || r.reason === reason;
            return matchSearch && matchDate && matchReason;
        });

        if (filtered.length === 0) {
            document.getElementById('stockOutTableBody').innerHTML =
                '<tr><td colspan="8" style="text-align:center;padding:30px;color:#95a5a6;">No records found.</td></tr>';
            return;
        }

        const reasonLabels = {
            sold:     '<span class="reason-badge sold">Sold</span>',
            damaged:  '<span class="reason-badge damaged">Damaged</span>',
            expired:  '<span class="reason-badge expired">Expired</span>',
            returned: '<span class="reason-badge returned">Returned</span>',
        };

        document.getElementById('stockOutTableBody').innerHTML = filtered.map((r, i) => `
            <tr>
                <td>${i + 1}</td>
                <td>${r.date ? new Date(r.date).toLocaleDateString() : '—'}</td>
                <td><strong>${r.product_name}</strong></td>
                <td>${r.quantity}</td>
                <td>${r.unit || '—'}</td>
                <td>${reasonLabels[r.reason] || r.reason}</td>
                <td>${r.recorded_by_name || '—'}</td>
                <td>${r.notes || '—'}</td>
            </tr>
        `).join('');
    }

    function openAddModal() {
        document.getElementById('stockOutModal').style.display = 'flex';
        updateStockInfo();
    }

    function closeModal() {
        document.getElementById('stockOutModal').style.display = 'none';
        document.getElementById('stockOutQty').value   = '';
        document.getElementById('stockOutNotes').value = '';
        document.getElementById('stockOutDate').valueAsDate = new Date();
    }

    async function saveStockOut() {
        let product_id = document.getElementById('stockOutProduct').value;
        let quantity   = parseInt(document.getElementById('stockOutQty').value);
        let unit       = document.getElementById('stockOutUnit').value;
        let reason     = document.getElementById('stockOutReason').value;
        let date       = document.getElementById('stockOutDate').value;
        let notes      = document.getElementById('stockOutNotes').value.trim();

        if (!product_id || isNaN(quantity) || quantity < 1) {
            alert('Please select a product and enter a valid quantity.');
            return;
        }

        // Check if enough stock
        let select   = document.getElementById('stockOutProduct');
        let selected = select.options[select.selectedIndex];
        let curStock = parseInt(selected.getAttribute('data-stock'));

        if (quantity > curStock) {
            alert(`Not enough stock! Current stock is ${curStock}.`);
            return;
        }

        try {
            const res  = await fetch('/api/stock-out/add/', {
                method:  'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken':  getCookie('csrftoken'),
                },
                body: JSON.stringify({ product_id, quantity, unit, reason, date, notes }),
            });
            const data = await res.json();
            if (data.success) {
                alert('Stock Out recorded successfully!');
                closeModal();
                loadProducts();
                loadStockOut();
            } else {
                alert(data.message || 'Something went wrong.');
            }
        } catch (err) {
            alert('Error: ' + err.message);
        }
    }

    function getCookie(name) {
        let value = `; ${document.cookie}`;
        let parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(';').shift();
    }

    function logout() { window.location.href = '/logout/'; }

    document.getElementById('filterDate').addEventListener('change',   () => renderTable(stockOutRecords));
    document.getElementById('filterReason').addEventListener('change', () => renderTable(stockOutRecords));
    document.getElementById('filterSearch').addEventListener('input',  () => renderTable(stockOutRecords));

    loadProducts();
    loadStockOut();
</script>

{% endblock %}
